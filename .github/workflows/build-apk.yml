name: Build CheryVIN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y openjdk-17-jdk zip unzip git autoconf libtool pkg-config libffi-dev cmake

      - name: Pre‑create android license file (关键修复！绕过交互式同意)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Install python build tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload built APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheryVIN‑APK
          path: bin/*.apk
