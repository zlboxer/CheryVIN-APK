name: Build APK

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. 安装 Linux 系统依赖
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo-dev

      # 4. 安装 Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      # 5. 构建 APK
      - name: Build APK
        run: |
          buildozer android debug

      # 6. 上传 APK 产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: VIN-PIN-Calculator-APK
          path: bin/*.apk
